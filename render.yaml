services:
  - type: web
    name: phonelink-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DASHBOARD_PIN
        value: 9211
      - key: LICENSE_KEY
        value: 9211921192119211

