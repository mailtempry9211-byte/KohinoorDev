<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneLink Hub - Server Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    body {
      background: #0B0F19;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, #131B2E, #0F172A);
      border: 1px solid #1E293B;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.15);
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      font-size: 24px;
    }
    .title h1 {
      font-size: 19px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }
    .title p {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 2px;
    }
    .info-banner {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 22px;
      font-size: 12px;
      color: #CBD5E1;
      line-height: 1.5;
    }
    .info-banner strong {
      color: #38BDF8;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    input[type="number"] {
      width: 100%;
      background: #090D16;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 16px;
      font-family: monospace;
      color: #FFFFFF;
      outline: none;
      transition: all 0.2s ease;
    }
    input[type="number"]:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .chips {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chip {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: monospace;
    }
    .chip:hover {
      background: #334155;
      color: #FFFFFF;
      border-color: #6366F1;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #6366F1;
      cursor: pointer;
    }
    .checkbox-row span {
      font-size: 12px;
      color: #94A3B8;
    }
    .launch-btn {
      width: 100%;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .launch-btn:hover {
      background: linear-gradient(135deg, #4338CA, #4F46E5);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -5px rgba(99, 102, 241, 0.5);
    }
    .launch-btn:active {
      transform: translateY(0);
    }
    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon-box">🛡️</div>
      <div class="title">
        <h1>PhoneLink Hub</h1>
        <p>Parental Control &amp; Management Suite</p>
      </div>
    </div>

    <div class="info-banner" id="ipBanner">
      Local Network IP: <strong id="localIpText">Detecting...</strong><br>
      Android app will connect to this IP &amp; chosen Port.
    </div>

    <form id="portForm">
      <div class="form-group">
        <label for="portInput">Select Server Port</label>
        <div class="input-wrapper">
          <input type="number" id="portInput" min="1024" max="65535" value="5000" required>
        </div>
        <div class="chips">
          <div class="chip" onclick="setPort(5000)">5000 (Default)</div>
          <div class="chip" onclick="setPort(5001)">5001</div>
          <div class="chip" onclick="setPort(8080)">8080</div>
          <div class="chip" onclick="setPort(8888)">8888</div>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="rememberCheck" checked>
        <span>Remember this port and launch automatically next time</span>
      </label>

      <button type="submit" class="launch-btn" id="startBtn">
        <span>🚀 Launch Standalone Hub</span>
      </button>
    </form>

    <div class="footer">
      Pure Desktop App • Embedded Server • Zero Chrome Window
    </div>
  </div>

  <script>
    const portInput = document.getElementById('portInput');
    const rememberCheck = document.getElementById('rememberCheck');
    const localIpText = document.getElementById('localIpText');

    function setPort(val) {
      portInput.value = val;
    }

    if (window.electronAPI) {
      window.electronAPI.getConfig().then(cfg => {
        if (cfg.port) portInput.value = cfg.port;
        if (cfg.localIp) localIpText.innerText = cfg.localIp;
      });
    }

    document.getElementById('portForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const port = parseInt(portInput.value, 10);
      const remember = rememberCheck.checked;
      if (port < 1024 || port > 65535) {
        alert('Please choose a valid port between 1024 and 65535.');
        return;
      }
      document.getElementById('startBtn').innerText = '⏳ Starting PhoneLink Server...';
      document.getElementById('startBtn').disabled = true;

      if (window.electronAPI) {
        window.electronAPI.startServer({ port, remember });
      }
    });
  </script>
</body>
</html>
