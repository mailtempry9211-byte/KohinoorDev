name: Build Signed Android APKs

on: [push, workflow_dispatch]

jobs:
  build-lawnchair-phonelink:
    name: Build Merged Lawnchair 16 Launcher Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==

      - name: Prepare Release Keystore
        id: keystore
        run: |
          mkdir -p keystore_dir
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore_dir/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore_dir/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore keystore_dir/release.keystore \
              -alias phonelink \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass phonelink123 \
              -keypass phonelink123 \
              -dname "CN=PhoneLink, OU=Hub, O=OpenSource, L=Local, S=State, C=US"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore_dir/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=phonelink123" >> $GITHUB_ENV
            echo "KEY_ALIAS=phonelink" >> $GITHUB_ENV
            echo "KEY_PASSWORD=phonelink123" >> $GITHUB_ENV
          fi

      - name: Prepare Lawnchair Source Tree
        run: |
          echo "Cloning official Lawnchair 16-dev repository with submodules..."
          git clone --depth 1 --branch 16-dev --recurse-submodules https://github.com/LawnchairLauncher/lawnchair.git lawnchair-source

      - name: Merge PhoneLink into Lawnchair
        run: |
          node merge_phonelink.js lawnchair-source

      - name: Configure Lawnchair Release Signing
        run: |
          cat << EOF > lawnchair-source/keystore.properties
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=$KEYSTORE_FILE
          EOF

      - name: Build Lawnchair Release APK
        run: |
          cd lawnchair-source
          chmod +x gradlew
          ./gradlew assembleLawnWithQuickstepGithubRelease --stacktrace 2>&1 | tee lawnchair-build.log

      - name: Output Failure Log on Error
        if: failure()
        run: |
          echo "## ❌ Lawnchair Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 lawnchair-source/lawnchair-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect and Rename Output APK
        run: |
          mkdir -p release_output
          find lawnchair-source/build/outputs -type f -name "*.apk" -exec cp {} release_output/Lawnchair-PhoneLink-16-Release.apk \;
          cd release_output
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Merged Lawnchair Release APK & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-PhoneLink-Release-APK
          path: |
            release_output/*.apk
            release_output/SHA256SUMS.txt

  build-standalone-client:
    name: Build Standalone PhoneLink Client APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias phonelink \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass phonelink123 \
              -keypass phonelink123 \
              -dname "CN=PhoneLink, OU=Hub, O=OpenSource, L=Local, S=State, C=US"
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=phonelink123" >> $GITHUB_ENV
            echo "KEY_ALIAS=phonelink" >> $GITHUB_ENV
            echo "KEY_PASSWORD=phonelink123" >> $GITHUB_ENV
          fi

      - name: Build Standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect Standalone APK
        run: |
          mkdir -p standalone_output
          find android -type f -name "*.apk" -exec cp {} standalone_output/PhoneLink-Standalone-Client.apk \;
          cd standalone_output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Standalone Release APK
        uses: actions/upload-artifact@v4
        with:
          name: phonelink-standalone-release
          path: |
            standalone_output/*.apk
            standalone_output/SHA256SUMS.txt
