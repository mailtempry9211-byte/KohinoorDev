name: Build Signed Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        id: keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias phonelink \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass phonelink123 \
              -keypass phonelink123 \
              -dname "CN=PhoneLink, OU=Hub, O=OpenSource, L=Local, S=State, C=US"
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=phonelink123" >> $GITHUB_ENV
            echo "KEY_ALIAS=phonelink" >> $GITHUB_ENV
            echo "KEY_PASSWORD=phonelink123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Generate SHA-256 Checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Signed Release APK & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: phonelink-hub-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
