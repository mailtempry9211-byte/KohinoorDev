name: Build PhoneLink Client Release APK

on: [push, workflow_dispatch]

jobs:
  build-phonelink-client:
    name: Build Signed PhoneLink Client Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Prepare Release Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias phonelink \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass phonelink123 \
              -keypass phonelink123 \
              -dname "CN=PhoneLink, OU=Hub, O=OpenSource, L=Local, S=State, C=US"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=phonelink123" >> $GITHUB_ENV
            echo "KEY_ALIAS=phonelink" >> $GITHUB_ENV
            echo "KEY_PASSWORD=phonelink123" >> $GITHUB_ENV
          fi

      - name: Build Android Client Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Gradle build failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Display Gradle Error on Failure
        if: always()
        run: |
          if [ -f android/build.log ]; then
            echo "================= GRADLE BUILD LOG (TAIL 300) ================="
            tail -n 300 android/build.log
            echo "## Gradle Build Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 android/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(> Task |FAILURE:|e: |error: |Exception: |Caused by: )" android/build.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=Gradle Error::$line"
            done
          fi

      - name: Upload Build Log Artifact on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log

      - name: Collect and Name Output APK
        run: |
          mkdir -p dist_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp -v {} dist_apk/PhoneLink-Client-v1.0-Release.apk \;
          cd dist_apk
          ls -la
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload PhoneLink Client Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-Client-v1.0-Release-APK
          path: |
            dist_apk/*.apk
            dist_apk/SHA256SUMS.txt
